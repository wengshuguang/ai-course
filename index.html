    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Microsoft YaHei", Consolas, monospace;
        }

        /* =========【改动1】html、body 占满视口，关闭全局滚动 ========= */
        html,
        body {
            height: 100%;
            overflow: hidden;
        }

        body {
            background: #0f1722;
            color: #e8edf3;
            line-height: 1.6;
        }

        /* 顶栏 */
        #topBar {
            height: 58px;
            background: #1a2436;
            border-bottom: 1px solid #2c3b54;
            display: flex;
            align-items: center;
            padding: 0 16px;
            gap: 12px;
            position: relative;
            /* 不需要额外fixed，外层布局锁死高度，天然固定在顶部 */
        }

        #topBar h1 {
            font-size: 28px;
            color: #82c1ff;
            font-weight: normal;
        }

        #toggleSideBtn {
            background: #2374d8;
            color: #fff;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 18px;
        }

        /* =========【改动2】layoutWrap 锁定高度，禁止外层滚动 ========= */
        #layoutWrap {
            display: flex;
            height: calc(100vh - 48px);
            overflow: hidden;
        }

        /* =========【改动3】侧边栏开启纵向独立滚动 ========= */
        #sidebar {
            width: 380px;
            background: #1a2436;
            border-right: 1px solid #2c3b54;
            overflow-y: auto;
            /* 侧边栏目录独立滚动 */
            transition: width 0.3s ease;
            flex-shrink: 0;
        }

        #sidebar.collapsed {
            width: 0px;
            overflow: hidden;
            border-right: none;
        }

        #sidebarInner {
            padding: 14px 10px;
        }

        .sidebar-group-title {
            color: #73b8ff;
            font-size: 16px;
            margin: 10px 0 6px 0;
            font-weight: bold;
        }

        .sidebar-item {
            display: block;
            color: #b4c2d8;
            text-decoration: none;
            font-size: 14px;
            padding: 2px 8px;
            margin: 2px 0;
            border-radius: 4px;
            cursor: pointer;
        }

        .sidebar-item:hover {
            background: #2c3b54;
            color: #fff;
        }

        /* =========【改动4】主内容区开启纵向独立滚动 ========= */
        #mainArea {
            flex: 1;
            overflow-y: auto;
            /* 右侧卡片区域独立滚动 */
            padding: 24px 32px;
        }

        #mainArea h2 {
            color: #d0e8ff;
            margin-bottom: 20px;
        }

        /* 首页卡片网格，适配长描述文本 */
        .card-wrap {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 24px;
        }

        .know-card {
            background: #172233;
            border: 1px solid #2c3b54;
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            flex-direction: column;
        }

        .know-card:hover {
            border-color: #4096ff;
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(0, 110, 220, 0.2);
        }

        .card-img {
            width: 100%;
            height: 160px;
            object-fit: cover;
            display: block;
        }

        .card-body {
            padding: 16px;
            flex: 1;
        }

        .card-body h3 {
            font-size: 16px;
            color: #b8e0ff;
            margin-bottom: 10px;
            line-height: 1.4;
        }

        .card-body p {
            font-size: 15px;
            color: #c5d6ee;
            line-height: 1.5;
            display: -webkit-box;
            /* -webkit-line-clamp: 6; */
            /*! autoprefixer: off */
            -webkit-box-orient: vertical;
            overflow: hidden;
        }


        /* 滚动条美化 */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #1a2436;
        }

        ::-webkit-scrollbar-thumb {
            background: #445a7d;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #58739c;
        }

        /* 响应式小屏幕适配 */
        @media (max-width:768px) {
            #mainArea {
                padding: 16px;
            }

            .card-wrap {
                grid-template-columns: 1fr;
            }

            #sidebar {
                width: 220px;
            }
        }
    </style>
</head>

        // 渲染侧边栏
        function renderSidebar() {
            const sidebarInner = document.getElementById('sidebarInner');
            sidebarInner.innerHTML = '';
            catalogData.forEach(group => {
                const gTitle = document.createElement('div');
                gTitle.className = 'sidebar-group-title';
                gTitle.innerText = group.groupName;
                sidebarInner.appendChild(gTitle);
                group.items.forEach(item => {
                    const a = document.createElement('a');
                    a.className = 'sidebar-item';
                    a.innerText = item.title;
                    a.href = `${group.folder}/${item.file}`;
                    sidebarInner.appendChild(a);
                })
            })
        }

        // 渲染带图片+长简介卡片
        function renderHomeCards() {
            const cardContainer = document.getElementById('cardContainer');
            cardContainer.innerHTML = '';
            catalogData.forEach(group => {
                group.items.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'know-card';
                    card.innerHTML = `
                    <img class="card-img" src="${item.img}" alt="${item.title}" loading="lazy">
                    <div class="card-body">
                        <h3>${item.title}</h3>
                        <p>${item.desc}</p>
                    </div>
                    `;
                    card.onclick = () => {
                        window.location.href = `${group.folder}/${item.file}`;
                    }
                    cardContainer.appendChild(card);
                })
            })
        }

        document.getElementById('toggleSideBtn').onclick = () => {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('collapsed');
            document.getElementById('toggleSideBtn').innerText = sidebar.classList.contains('collapsed') ? "展开侧边栏" : "折叠侧边栏";
        }

        renderSidebar();
        renderHomeCards();
    </script>
